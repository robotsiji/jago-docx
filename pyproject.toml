[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jago-docx"
version = "1.0.0"
description = "Expert Anti-Slop Microsoft Word (.docx) Generator with Arial MS Docs Headings, Native Footnotes, Editable Formulas, and Under-Element Captions"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Jago Docx Team" }
]
keywords = [
    "docx",
    "word",
    "antislop",
    "microsoft-docs",
    "apa-style",
    "omml",
    "openxml",
    "academic-writing",
    "document-generator"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup",
    "Topic :: Software Development :: Documentation"
]
dependencies = [
    "python-docx>=1.1.0",
    "lxml>=5.0.0"
]

[project.scripts]
jago-docx = "jago_docx.cli:main"

[project.urls]
Homepage = "https://github.com/username/jago-docx"
Repository = "https://github.com/username/jago-docx.git"
Issues = "https://github.com/username/jago-docx/issues"
